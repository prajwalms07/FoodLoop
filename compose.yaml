services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////data/foodloop.db
      UPLOAD_FOLDER: /data/uploads
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}}"
      SECRET_KEY: "${SECRET_KEY:-local-development-only}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-local-development-only}"
      JWT_ACCESS_TOKEN_HOURS: "${JWT_ACCESS_TOKEN_HOURS:-12}"
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    volumes:
      - foodloop_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:${API_PORT:-5000}/api}"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  foodloop_data:
